{% extends "layout/base.html" %}

{% block title %}
Add Medicine
{% endblock %}

{% block content %}

<div class="container-fluid">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="fw-bold">
                <i class="fas fa-plus-circle text-success"></i>
                Add Medicine
            </h2>

            <p class="text-muted">
                Register a new medicine in the pharmacy.
            </p>
        </div>

        <a href="{{ url_for('pharmacy.list_medicines') }}"
           class="btn btn-secondary">

            <i class="fas fa-arrow-left"></i>
            Back

        </a>

    </div>

    <div class="card shadow">

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Medicine Code</label>

                        <input type="text"
                               name="medicine_code"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-8 mb-3">

                        <label class="form-label">Medicine Name</label>

                        <input type="text"
                               name="name"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Category</label>

                        <input type="text"
                               name="category"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Manufacturer</label>

                        <input type="text"
                               name="manufacturer"
                               class="form-control">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Batch No.</label>

                        <input type="text"
                               name="batch_no"
                               class="form-control">

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">Purchase Price (₹)</label>

                        <input type="number"
                               step="0.01"
                               name="purchase_price"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">Selling Price (₹)</label>

                        <input type="number"
                               step="0.01"
                               name="selling_price"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">Quantity</label>

                        <input type="number"
                               name="quantity"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-3 mb-3">

                        <label class="form-label">Minimum Stock</label>

                        <input type="number"
                               name="minimum_stock"
                               class="form-control"
                               value="10">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Expiry Date</label>

                        <input type="date"
                               name="expiry_date"
                               class="form-control"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">Status</label>

                        <select name="status"
                                class="form-select">

                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>

                        </select>

                    </div>

                </div>

                <hr>

                <button type="submit"
                        class="btn btn-success">

                    <i class="fas fa-save"></i>
                    Save Medicine

                </button>

                <a href="{{ url_for('pharmacy.list_medicines') }}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
