{% extends "layout/base.html" %}

{% block title %}
Edit Supplier
{% endblock %}

{% block content %}

<div class="container-fluid">

    <!-- Header -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold">
                <i class="fas fa-edit text-primary"></i>
                Edit Supplier
            </h2>

            <p class="text-muted">
                Update supplier information.
            </p>

        </div>

        <a href="{{ url_for('supplier.list_suppliers') }}"
           class="btn btn-secondary">

            <i class="fas fa-arrow-left"></i>
            Back

        </a>

    </div>

    <div class="card shadow">

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Supplier Code
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ supplier.supplier_code }}"
                            readonly>

                    </div>

                    <div class="col-md-8 mb-3">

                        <label class="form-label">
                            Company Name
                        </label>

                        <input
                            type="text"
                            name="company_name"
                            class="form-control"
                            value="{{ supplier.company_name }}"
                            required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Contact Person
                        </label>

                        <input
                            type="text"
                            name="contact_person"
                            class="form-control"
                            value="{{ supplier.contact_person }}">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            value="{{ supplier.phone }}">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ supplier.email }}">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            GST Number
                        </label>

                        <input
                            type="text"
                            name="gst_number"
                            class="form-control"
                            value="{{ supplier.gst_number }}">

                    </div>

                    <div class="col-md-12 mb-3">

                        <label class="form-label">
                            Address
                        </label>

                        <textarea
                            name="address"
                            rows="4"
                            class="form-control">{{ supplier.address }}</textarea>

                    </div>

                    <div class="col-md-12 mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select
                            name="status"
                            class="form-select">

                            <option value="Active"
                                {% if supplier.status == "Active" %}selected{% endif %}>
                                Active
                            </option>

                            <option value="Inactive"
                                {% if supplier.status == "Inactive" %}selected{% endif %}>
                                Inactive
                            </option>

                        </select>

                    </div>

                </div>

                <hr>

                <button
                    type="submit"
                    class="btn btn-primary">

                    <i class="fas fa-save"></i>
                    Update Supplier

                </button>

                <a href="{{ url_for('supplier.list_suppliers') }}"
                   class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
