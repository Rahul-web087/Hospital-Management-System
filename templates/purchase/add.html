{% extends "layout/base.html" %}

{% block title %}
Add Purchase
{% endblock %}

{% block content %}

<div class="container-fluid">

    <!-- Header -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h3 class="fw-bold">

                <i class="fas fa-cart-plus text-primary"></i>

                Add Purchase

            </h3>

            <p class="text-muted mb-0">

                Create a new medicine purchase

            </p>

        </div>

        <a href="{{ url_for('purchase.list_purchases') }}"
           class="btn btn-secondary">

            <i class="fas fa-arrow-left"></i>

            Back

        </a>

    </div>

    <form method="POST">

        <!-- Purchase Information -->

        <div class="card shadow border-0 mb-4">

            <div class="card-header bg-primary text-white">

                <h5 class="mb-0">

                    Purchase Information

                </h5>

            </div>

            <div class="card-body">

                <div class="row">

                    <!-- Supplier -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Supplier

                        </label>

                        <select
                            name="supplier_id"
                            class="form-select"
                            required>

                            <option value="">

                                Select Supplier

                            </option>

                            {% for supplier in suppliers %}

                            <option value="{{ supplier.id }}">

                                {{ supplier.name }}

                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <!-- Invoice -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Invoice Number

                        </label>

                        <input
                            type="text"
                            name="invoice_no"
                            class="form-control">

                    </div>

                    <!-- Date -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Purchase Date

                        </label>

                        <input
                            type="date"
                            name="purchase_date"
                            class="form-control"
                            required>

                    </div>

                    <!-- Payment -->

                    <div class="col-md-4 mb-3">

                        <label class="form-label">

                            Payment Status

                        </label>

                        <select
                            name="payment_status"
                            class="form-select">

                            <option value="Pending">

                                Pending

                            </option>

                            <option value="Paid">

                                Paid

                            </option>

                            <option value="Partial">

                                Partial

                            </option>

                        </select>

                    </div>

                </div>

            </div>

        </div>

        <!-- Purchase Items -->

        <div class="card shadow border-0">

            <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">

                <h5 class="mb-0">

                    Purchase Items

                </h5>

                <button
                    type="button"
                    class="btn btn-light btn-sm"
                    id="addRow">

                    <i class="fas fa-plus"></i>

                    Add Item

                </button>

            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-bordered" id="purchaseTable">

                        <thead>

                        <tr>

                            <th width="35%">Medicine</th>

                            <th width="15%">Quantity</th>

                            <th width="20%">Purchase Price</th>

                            <th width="20%">Total</th>

                            <th width="10%">Action</th>

                        </tr>

                        </thead>

                        <tbody id="purchaseBody">

                        <tr>
                                                    <td>

                                <select
                                    name="medicine_id[]"
                                    class="form-select medicine"
                                    required>

                                    <option value="">
                                        Select Medicine
                                    </option>

                                    {% for medicine in medicines %}

                                    <option value="{{ medicine.id }}">

                                        {{ medicine.name }}

                                    </option>

                                    {% endfor %}

                                </select>

                            </td>

                            <td>

                                <input
                                    type="number"
                                    name="quantity[]"
                                    class="form-control quantity"
                                    min="1"
                                    value="1"
                                    required>

                            </td>

                            <td>

                                <input
                                    type="number"
                                    name="purchase_price[]"
                                    class="form-control price"
                                    step="0.01"
                                    min="0"
                                    value="0">

                            </td>

                            <td>

                                <input
                                    type="text"
                                    class="form-control total"
                                    value="0.00"
                                    readonly>

                            </td>

                            <td class="text-center">

                                <button
                                    type="button"
                                    class="btn btn-danger removeRow">

                                    <i class="fas fa-trash"></i>

                                </button>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

                <hr>

                <div class="row">

                    <div class="col-md-4">

                        <label class="form-label">

                            Discount

                        </label>

                        <input
                            type="number"
                            name="discount"
                            id="discount"
                            class="form-control"
                            value="0"
                            step="0.01">

                    </div>

                    <div class="col-md-4">

                        <label class="form-label">

                            Tax

                        </label>

                        <input
                            type="number"
                            name="tax"
                            id="tax"
                            class="form-control"
                            value="0"
                            step="0.01">

                    </div>

                    <div class="col-md-4">

                        <label class="form-label">

                            Grand Total

                        </label>

                        <input
                            type="text"
                            id="grandTotal"
                            class="form-control fw-bold"
                            value="0.00"
                            readonly>

                    </div>

                    <div class="col-md-12 mt-3">

                        <label class="form-label">

                            Remarks

                        </label>

                        <textarea
                            name="remarks"
                            rows="4"
                            class="form-control"
                            placeholder="Enter remarks (optional)"></textarea>

                    </div>

                </div>

            </div>

            <div class="card-footer text-end">

                <button
                    type="reset"
                    class="btn btn-secondary">

                    <i class="fas fa-rotate-left"></i>

                    Reset

                </button>

                <button
                    type="submit"
                    class="btn btn-primary">

                    <i class="fas fa-save"></i>

                    Save Purchase

                </button>

            </div>

        </div>

    </form>

</div>

{% endblock %}

{% block js %}

<script>

document.addEventListener("DOMContentLoaded", function () {

    const tbody = document.getElementById("purchaseBody");

    const addRowBtn = document.getElementById("addRow");

    const discount = document.getElementById("discount");

    const tax = document.getElementById("tax");

    const grandTotal = document.getElementById("grandTotal");

    // ===========================
    // Calculate Grand Total
    // ===========================

    function calculateTotal() {

        let subtotal = 0;

        document.querySelectorAll("#purchaseBody tr").forEach(function (row) {

            const qty = parseFloat(
                row.querySelector(".quantity").value
            ) || 0;

            const price = parseFloat(
                row.querySelector(".price").value
            ) || 0;

            const total = qty * price;

            row.querySelector(".total").value =
                total.toFixed(2);

            subtotal += total;

        });

        let discountValue =
            parseFloat(discount.value) || 0;

        let taxValue =
            parseFloat(tax.value) || 0;

        grandTotal.value =
            (subtotal - discountValue + taxValue).toFixed(2);

    }

    // ===========================
    // Add Row
    // ===========================

    addRowBtn.addEventListener("click", function () {

        const firstRow =
            tbody.querySelector("tr");

        const newRow =
            firstRow.cloneNode(true);

        newRow.querySelector(".medicine").selectedIndex = 0;

        newRow.querySelector(".quantity").value = 1;

        newRow.querySelector(".price").value = 0;

        newRow.querySelector(".total").value = "0.00";

        tbody.appendChild(newRow);

    });

    // ===========================
    // Remove Row
    // ===========================

    tbody.addEventListener("click", function (e) {

        if (e.target.closest(".removeRow")) {

            if (tbody.querySelectorAll("tr").length > 1) {

                e.target.closest("tr").remove();

                calculateTotal();

            }

        }

    });

    // ===========================
    // Auto Calculation
    // ===========================

    tbody.addEventListener("input", function (e) {

        if (
            e.target.classList.contains("quantity") ||
            e.target.classList.contains("price")
        ) {

            calculateTotal();

        }

    });

    discount.addEventListener("input", calculateTotal);

    tax.addEventListener("input", calculateTotal);

    calculateTotal();

});

</script>

{% endblock %}
